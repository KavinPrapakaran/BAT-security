spring:
  application:
    name: cognesis
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true

cognesis:
  algorithm:
    band:
      monitor: 0.30
      warn: 0.45
      challenge: 0.58
      escalate: 0.68
      isolate: 0.82
      block: 0.92
    low-confidence-threshold: 0.25
    escalate-when-uncertain: true
  trust:
    default-trust: 0.5
    positive-gain: 0.15
    negative-gain: 0.35
    decay-rate: 0.005
    observations-for-full-confidence: 60
    trust-graph-influence: 0.30
  memory:
    activation-decay: 0.02
    recall-limit: 20
  dns:
    weights:
      evidence: 0.50
      trust: 0.15
      memory: 0.08
      intent: 0.08
      prediction: 0.05
      deviation: 0.04
    likelihood-weight: 0.70

logging:
  level:
    com.cognesis: INFO
    org.flywaydb: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/cognesis
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
