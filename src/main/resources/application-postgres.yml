spring:
  datasource:
    url: ${COGNESIS_DB_URL:jdbc:postgresql://localhost:5432/cognesis}
    username: ${COGNESIS_DB_USER:cognesis}
    password: ${COGNESIS_DB_PASSWORD:cognesis}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  sql:
    init:
      mode: never

cognesis:
  algorithm:
    band:
      warn: 0.30
      monitor: 0.52
      block: 0.78
